name: Examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        example:
          - hello-world
          - hello-world-redlib
          - archive-tweak-registration
          - sharedpunk-reversing
        mode: [debug, release]

    runs-on: windows-2025

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Examples-${{ matrix.example }}-${{ matrix.mode }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@master
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'examples-${{ matrix.mode }}'

      # The examples point add_repositories at the checkout, so this builds them against
      # the packages as they are in this commit rather than whatever is on main.
      - name: Build ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          xmake f -p windows -a x64 -m ${{ matrix.mode }} -y
          xmake -y
