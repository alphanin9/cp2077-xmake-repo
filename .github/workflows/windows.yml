name: Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package names to test, separated by spaces (blank: the ones the last commit changed)'
        required: false
        default: ''
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Packages-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/test.lua diffs against HEAD^ to find the packages to test.
          fetch-depth: 2

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@master
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'packages-${{ matrix.os }}'

      # Every package here is a Cyberpunk 2077 mod dependency: windows/x64, and MD only,
      # because that is what the game and RED4ext plugins are built against. The macOS
      # build of the game is tested in macos.yml.
      - name: Test packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          xmake --version
          $packages = -split "$env:PACKAGES"
          xmake l ./scripts/test.lua -vD -p windows -a x64 --runtimes=MD --linkjobs=2 @packages
