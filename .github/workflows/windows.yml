name: Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Packages-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/test.lua diffs against HEAD^ to find the packages to test.
          fetch-depth: 2

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@master
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'packages-${{ matrix.os }}'

      # Every package here is a Cyberpunk 2077 mod dependency: windows/x64 only, and MD
      # only, because that is what the game and RED4ext plugins are built against.
      - name: Test packages
        run: |
          xmake --version
          xmake l ./scripts/test.lua -vD -p windows -a x64 --runtimes=MD --linkjobs=2
